<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deloop Logo - Option 2C</title>
<!-- Wordmark: Space Grotesk Bold (SIL Open Font License 1.1), converted to vector paths. -->
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #475569;          /* Slate Blue (Option 2C Secondary) for 'loop' */
    --settled: #6D28D9;      /* Vivid Deep Violet (Option 2C Primary) for 'de' & final ring */
    --node-dot: #C4B5FD;     /* Soft Lavender / Violet Tint for the settled nodes */
    --muted: #64748B;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color-scheme: light; display: grid; place-items: center; font-family: system-ui, sans-serif; }
  .stage { width: min(640px, calc(100vw - 32px)); text-align: center; }
  .logo { width: 100%; height: auto; display: block; cursor: pointer; overflow: visible; }

  /* 1. four debts run round the ring, one business to the next */
  .debt {
    fill: none; stroke: var(--c); stroke-width: 72; stroke-linecap: butt;
    stroke-dasharray: 1 2; stroke-dashoffset: 1;
    animation: draw 0.3s cubic-bezier(.45, 0, .55, 1) var(--d) forwards,
               fade .25s ease-out 2.16s forwards;
  }
  .head {
    fill: var(--c); opacity: 0; transform-box: fill-box; transform-origin: center;
    animation: pop .22s cubic-bezier(.3, 1.6, .5, 1) var(--d) forwards,
               shrink .22s ease-in 1.54s forwards;
  }
  .node {
    fill: #fff; stroke: var(--ink); stroke-width: 20;
    transform-box: fill-box; transform-origin: center; transform: scale(0);
    animation: pop .28s cubic-bezier(.3, 1.6, .5, 1) var(--d) forwards,
               settle .3s ease-out var(--s) forwards;
  }
  /* 2. the round clears: one unbroken ring, every debt settled */
  .ring {
    fill: none; stroke: var(--settled); stroke-width: 72;
    stroke-dasharray: 1 2; stroke-dashoffset: 1;
    animation: draw 0.62s cubic-bezier(.55, 0, .35, 1) 1.59s forwards;
  }
  .mark { transform-box: fill-box; transform-origin: center;
           animation: pulse .5s cubic-bezier(.3, 1.4, .5, 1) 2.21s; }
  /* 3. the name */
  .ch { fill: var(--ink); opacity: 0; transform: translateY(70px);
         animation: rise .45s cubic-bezier(.2, .8, .2, 1) var(--d) forwards; }
  .ch.de { fill: var(--settled); }

  @keyframes draw   { to { stroke-dashoffset: 0; } }
  @keyframes fade   { to { opacity: 0; } }
  @keyframes pop    { 0% { opacity: 1; transform: scale(0); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes shrink { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0); } }
  @keyframes settle {
    from { transform: scale(1); stroke: var(--ink); fill: #fff; }
    50% { transform: scale(1.25); }
    to { transform: scale(1); stroke: var(--settled); fill: var(--node-dot); }
  }
  @keyframes pulse  { 50% { transform: scale(1.05); } }
  @keyframes rise   { to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .debt, .head, .node, .ring, .mark, .ch { animation: none; }
    .debt, .head { opacity: 0; }
    .node { transform: none; stroke: var(--settled); fill: var(--node-dot); }
    .ring { stroke-dashoffset: 0; }
    .ch { opacity: 1; transform: none; }
  }

  .replay {
    margin-top: 28px; padding: 8px 16px; border-radius: 999px;
    border: 1px solid #CBD5E1; background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; cursor: pointer; transition: all 0.2s ease;
  }
  .replay:hover { color: var(--settled); border-color: var(--settled); }
</style>
</head>
<body>

      </g>
    </svg>
    <button class="replay" type="button">Replay</button>
  </div>
<script>
  function replay() {
    const old = document.querySelector('.logo');
    const fresh = old.cloneNode(true);
    fresh.addEventListener('click', replay);
    old.replaceWith(fresh);
  }
  document.querySelector('.logo').addEventListener('click', replay);
  document.querySelector('.replay').addEventListener('click', replay);
</script>
</body>
</html>
