<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1144 -787 4527 1037" role="img" aria-label="Deloop">
  <style>
    :root {
      --ink: #475569;
      --settled: #6D28D9;
      --node-dot: #C4B5FD;
    }
    
    .debt {
      fill: none; stroke: var(--c); stroke-width: 72; stroke-linecap: butt;
      stroke-dasharray: 1 2; stroke-dashoffset: 0; opacity: 0;
      animation: draw 0.3s cubic-bezier(.45, 0, .55, 1) var(--d) forwards,
                 fade .25s ease-out 2.16s forwards;
    }
    .head {
      fill: var(--c); opacity: 0; transform-box: fill-box; transform-origin: center;
      animation: pop .22s cubic-bezier(.3, 1.6, .5, 1) var(--d) forwards,
                 shrink .22s ease-in 1.54s forwards;
    }
    .node {
      fill: var(--node-dot); stroke: var(--settled); stroke-width: 20;
      transform-box: fill-box; transform-origin: center;
      animation: popNode .28s cubic-bezier(.3, 1.6, .5, 1) var(--d) forwards,
                 settle .3s ease-out var(--s) forwards;
    }
    .ring {
      fill: none; stroke: var(--settled); stroke-width: 72;
      stroke-dasharray: 1 2; stroke-dashoffset: 0;
      animation: drawRing 0.62s cubic-bezier(.55, 0, .35, 1) 1.59s forwards;
    }
    .mark {
      transform-box: fill-box; transform-origin: center;
      animation: pulse .5s cubic-bezier(.3, 1.4, .5, 1) 2.21s;
    }
    .ch {
      fill: var(--ink); opacity: 1; transform: translateY(0);
      animation: rise .45s cubic-bezier(.2, .8, .2, 1) var(--d) forwards;
    }
    .ch.de { fill: var(--settled); }

    @keyframes draw { from { stroke-dashoffset: 1; opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
    @keyframes drawRing { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes fade { from { opacity: 1; } to { opacity: 0; } }
    @keyframes pop { 0% { opacity: 1; transform: scale(0); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes popNode { 0% { opacity: 1; transform: scale(0); stroke: var(--ink); fill: #fff; } 100% { opacity: 1; transform: scale(1); stroke: var(--ink); fill: #fff; } }
    @keyframes shrink { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0); } }
    @keyframes settle {
      from { transform: scale(1); stroke: var(--ink); fill: #fff; }
      50% { transform: scale(1.25); }
      to { transform: scale(1); stroke: var(--settled); fill: var(--node-dot); }
    }
    @keyframes pulse { 50% { transform: scale(1.05); } }
    @keyframes rise { from { opacity: 0; transform: translateY(70px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .debt, .head, .node, .ring, .mark, .ch { animation: none !important; }
      .debt, .head { opacity: 0 !important; }
      .node { transform: none !important; stroke: var(--settled) !important; fill: var(--node-dot) !important; }
      .ring { stroke-dashoffset: 0 !important; }
      .ch { opacity: 1 !important; transform: none !important; }
    }
  </style>
